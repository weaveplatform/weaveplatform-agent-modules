name: module-release

# Publishes a capability module when release-please tags it:
#
#   1. resolve the module directory from the tag and refuse a tag whose
#      directory, manifest id and manifest version disagree;
#   2. build every platform module.manifest.json declares (the manifest is the
#      only list, so the build cannot drift from it), on Linux;
#   3. for a module with darwin platforms, sign each darwin binary with the
#      organisation's Developer ID Application identity (hardened runtime,
#      secure timestamp), notarise it, and verify it with the requirement core
#      enforces; package it as a .pkg signed with the Developer ID Installer
#      identity, notarised and stapled. This runs on macOS, since codesign,
#      notarytool, pkgbuild and stapler exist nowhere else;
#   4. for a module with windows platforms, sign each windows binary with
#      Authenticode (SHA-256, RFC 3161 timestamp) using the organisation's
#      code-signing certificate, check its leaf thumbprint against the one the
#      manifest pins and its chain with WinVerifyTrust as a guest would, and
#      package it as a zip with signed install and uninstall scripts. This
#      runs on Windows, where signtool and WinVerifyTrust are;
#   5. stamp a sidecar copy of the manifest with each artifact's digest and
#      size, taken from the signed binaries, and push the binaries and the
#      sidecar to GHCR with ORAS as
#      ghcr.io/<owner>/weaveplatform-modules/<id>:<version>;
#   6. build .deb packages for Linux and attach all installers, binaries,
#      manifests and keyless-signed checksums to the module's GitHub release;
#   7. ask weaveplatform-release-channels for a promotion PR (module-published).
#
# The jobs are split by what each must hold. Only the signing jobs see a
# signing secret, each its own OS's, and they can write nothing: their tokens
# are read-only and they hand back artifacts. Only the publish job can write
# packages and releases, and it never sees a signing secret. Running the whole
# release on one OS would put both in one job and move every build onto a
# runner it does not need.
#
# release-please tags each module with its component, which is its path:
# modules/weave-<os>-<capability>/vX.Y.Z. That is also the module's Go tag, so
# one tag serves both, and the module directory is the tag less its "/v…".
#
# The published layout is a contract with weaveplatform-release-channels: its
# promote.yml pulls <id>:<version>, reads module.manifest.json from it, and
# records each artifact as <ref>#<os>-<arch> with the stamped digest and size.
# Binaries are named <id>-<goos>-<goarch>[.exe]; the sidecar is the module's own
# manifest with .version and .artifacts[{os, arch, digest, size}] set. The .pkg
# and .zip go to the GitHub release only: the channel pins binaries, not
# installers.
on:
  push:
    tags:
      - 'modules/weave-*/v*'
  workflow_dispatch:
    inputs:
      # Publish an existing tag only when its immutable artifacts do not exist.
      tag:
        description: Existing tag to publish, e.g. modules/weave-linux-presence/v0.2.0
        required: false
        default: ''
      # Prove a signing path on any ref: build, sign (and for macOS
      # notarise) and package one module from the dispatched ref, and upload
      # the results as workflow artifacts. Nothing is pushed, released or
      # dispatched.
      sign_check:
        description: A macOS or Windows module to sign and package from this ref without publishing, e.g. weave-windows-clipboard
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: module-release-${{ inputs.tag || inputs.sign_check || github.ref_name }}
  cancel-in-progress: false

jobs:
  module:
    name: 'Resolve the module'
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.resolve.outputs.dir }}
      id: ${{ steps.resolve.outputs.id }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      publish: ${{ steps.resolve.outputs.publish }}
      darwin: ${{ steps.resolve.outputs.darwin }}
      windows: ${{ steps.resolve.outputs.windows }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # A tag is checked out by name; a sign check builds the dispatched
      # commit. Later jobs check out the commit resolved here, so every job
      # builds, signs and stamps the same tree.
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      # The artifact is named by the manifest id and versioned by the tag, so a
      # tag whose directory, id and manifest version disagree would publish
      # under the wrong name or version. Refuse it here rather than in a
      # channel.
      - name: Module directory from the tag
        id: resolve
        env:
          TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}
          CHECK: ${{ inputs.sign_check }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ] && [ -n "$CHECK" ]; then
            echo "::error::set tag or sign_check, not both"; exit 1
          fi
          if [ -n "$CHECK" ]; then
            # A sign check: the module at the dispatched commit, at whatever
            # version its manifest declares, published nowhere.
            case "$CHECK" in
              weave-macos-* | weave-windows-*) ;;
              *) echo "::error::sign_check takes a macOS or Windows module, not $CHECK"; exit 1 ;;
            esac
            dir="modules/$CHECK"
            version=$(jq -r .version "$dir/module.manifest.json" 2>/dev/null) \
              || { echo "::error::no module $CHECK under modules/"; exit 1; }
            publish=false
          else
            [ -n "$TAG" ] || { echo "::error::set tag or sign_check"; exit 1; }
            dir="${TAG%/v*}"
            version="${TAG##*/v}"
            case "$dir" in
              modules/weave-*) ;;
              *) echo "::error::$TAG is not a capability module tag"; exit 1 ;;
            esac
            publish=true
          fi
          printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' \
            || { echo "::error::${TAG:-$CHECK} does not carry a semantic version"; exit 1; }
          manifest="$dir/module.manifest.json"
          [ -f "$manifest" ] || { echo "::error::$dir has no module.manifest.json"; exit 1; }
          id=$(jq -r .id "$manifest")
          [ "$id" = "${dir#modules/}" ] || { echo "::error::$manifest id is $id, not ${dir#modules/}"; exit 1; }
          declared=$(jq -r .version "$manifest")
          [ "$declared" = "$version" ] || { echo "::error::$manifest version is $declared, the tag is $version"; exit 1; }
          darwin=$(jq -r 'any(.platforms[]; .os == "darwin")' "$manifest")
          windows=$(jq -r 'any(.platforms[]; .os == "windows")' "$manifest")
          {
            echo "dir=$dir"
            echo "id=$id"
            echo "version=$version"
            echo "tag=$TAG"
            echo "ref=$(git rev-parse HEAD)"
            echo "publish=$publish"
            echo "darwin=$darwin"
            echo "windows=$windows"
          } >> "$GITHUB_OUTPUT"
          if [ "$publish" = true ]; then
            echo "publishing $id $version from $dir"
          else
            echo "sign check of $id $version from $dir at $(git rev-parse HEAD); nothing is published"
          fi

  build:
    name: 'Build ${{ needs.module.outputs.id }} ${{ needs.module.outputs.version }}'
    needs: [module]
    runs-on: ubuntu-24.04-arm
    env:
      ID: ${{ needs.module.outputs.id }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.module.outputs.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ needs.module.outputs.dir }}/go.mod
          cache-dependency-path: ${{ needs.module.outputs.dir }}/go.sum

      # GOWORK=off: the module as a consumer builds it, from its own go.mod
      # (the sdk arrives through its replace to ../../sdk at the same commit).
      - name: Build every platform the manifest declares
        working-directory: ${{ needs.module.outputs.dir }}
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          for pair in $(jq -r '.platforms[] | "\(.os)/\(.arch)"' module.manifest.json); do
            os="${pair%%/*}"
            arch="${pair##*/}"
            ext=""
            [ "$os" = windows ] && ext=".exe"
            echo "== $os/$arch"
            GOOS="$os" GOARCH="$arch" go build -trimpath -o "$RUNNER_TEMP/dist/${ID}-${os}-${arch}${ext}" .
          done
          ls -la "$RUNNER_TEMP/dist"

      - name: Upload the binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  sign-darwin:
    name: 'Sign and notarise ${{ needs.module.outputs.id }} for macOS'
    needs: [module, build]
    if: needs.module.outputs.darwin == 'true'
    runs-on: macos-latest
    # Read-only: this job holds the signing identities, so it writes nothing
    # but its own workflow artifacts.
    permissions:
      contents: read
    env:
      ID: ${{ needs.module.outputs.id }}
      DIR: ${{ needs.module.outputs.dir }}
      APPLE_TEAM: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.module.outputs.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packaging/modulepkg/go.mod
          cache: false

      - name: Download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: ${{ runner.temp }}/dist

      # The keychain and the notary key live under the runner's temp
      # directory, which a job-level env cannot name.
      - name: Signing paths
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/weave-signing.keychain-db" >> "$GITHUB_ENV"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary/AuthKey.p8" >> "$GITHUB_ENV"

      # Core refuses a darwin module whose manifest pins no team, and one
      # signed by a team other than the one pinned. Signing with a team the
      # manifest does not name would publish a module no device runs.
      - name: The manifest pins the signing team
        run: |
          set -euo pipefail
          [ -n "$APPLE_TEAM" ] || { echo "::error::the APPLE_TEAM_ID variable is not set"; exit 1; }
          pinned=$(jq -r '.signing.apple_team_id // empty' "$DIR/module.manifest.json")
          [ "$pinned" = "$APPLE_TEAM" ] || {
            echo "::error::$DIR/module.manifest.json pins apple_team_id '${pinned}', signing is with $APPLE_TEAM"
            exit 1
          }

      # A throwaway keychain holds both identities for this job alone; the
      # cleanup step deletes it, and the .p8, whatever happens. The partition
      # list lets codesign and pkgbuild use the keys without a UI prompt.
      - name: Import the signing identities
        env:
          APP_P12: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12 }}
          APP_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          for v in APP_P12 APP_P12_PASSWORD INSTALLER_P12 INSTALLER_P12_PASSWORD NOTARY_KEY_P8; do
            [ -n "${!v}" ] || { echo "::error::the secret behind $v is not available to this workflow"; exit 1; }
          done
          kc_password=$(openssl rand -base64 32)
          echo "::add-mask::$kc_password"
          security create-keychain -p "$kc_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$kc_password" "$KEYCHAIN"
          certs="$RUNNER_TEMP/certs"
          mkdir -p "$certs"
          printf '%s' "$APP_P12" | base64 --decode > "$certs/app.p12"
          printf '%s' "$INSTALLER_P12" | base64 --decode > "$certs/installer.p12"
          security import "$certs/app.p12" -k "$KEYCHAIN" -f pkcs12 -P "$APP_P12_PASSWORD" \
            -T /usr/bin/codesign >/dev/null
          security import "$certs/installer.p12" -k "$KEYCHAIN" -f pkcs12 -P "$INSTALLER_P12_PASSWORD" \
            -T /usr/bin/pkgbuild -T /usr/bin/productsign >/dev/null
          rm -rf "$certs"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_password" "$KEYCHAIN" >/dev/null
          # The keychain joins the search list, which pkgbuild --sign and
          # notarytool's codesign checks read; the existing entries stay.
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | sed -e 's/^ *"//' -e 's/" *$//')
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"

          mkdir -p "$(dirname "$NOTARY_KEY")"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY"
          chmod 600 "$NOTARY_KEY"

          # The identities by their certificates' names, which are public:
          # they are what codesign -dv and pkgutil print for every signed file.
          app=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n "s/^ *[0-9]*) \([0-9A-F]\{40\}\) \"Developer ID Application: .* (${APPLE_TEAM})\"$/\1/p" | head -n1)
          installer=$(security find-identity -v -p basic "$KEYCHAIN" \
            | sed -n "s/^ *[0-9]*) [0-9A-F]\{40\} \"\(Developer ID Installer: .* (${APPLE_TEAM})\)\"$/\1/p" | head -n1)
          [ -n "$app" ] || { echo "::error::no Developer ID Application identity for team $APPLE_TEAM"; exit 1; }
          [ -n "$installer" ] || { echo "::error::no Developer ID Installer identity for team $APPLE_TEAM"; exit 1; }
          echo "APP_IDENTITY=$app" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$installer" >> "$GITHUB_ENV"
          echo "application identity $app; installer identity: $installer"

      # Hardened runtime and a secure timestamp are what notarisation requires.
      # The identifier is the package's, so a module reads as weave's in
      # codesign -dv and in a TCC prompt rather than as its file name.
      - name: Sign the darwin binaries
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=("$RUNNER_TEMP/dist/${ID}"-darwin-*)
          [ "${#bins[@]}" -gt 0 ] || { echo "::error::the build produced no darwin binary"; exit 1; }
          for f in "${bins[@]}"; do
            echo "== $(basename "$f")"
            codesign --force --sign "$APP_IDENTITY" --keychain "$KEYCHAIN" \
              --options runtime --timestamp --identifier "run.weaveplatform.module.${ID}" "$f"
          done

      # A bare Mach-O cannot carry a stapled ticket, so Gatekeeper checks its
      # notarisation online, by the code directory hash Apple records here.
      - name: Notarise the darwin binaries
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          { echo "### Notarisation"; echo; echo "| File | Submission | Status |"; echo "|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/zip"
          for f in "$RUNNER_TEMP/dist/${ID}"-darwin-*; do
            zip="$RUNNER_TEMP/zip/$(basename "$f").zip"
            ditto -c -k --keepParent "$f" "$zip"
            .github/scripts/notarize.sh "$zip"
          done

      # Exactly core's check (agent-core internal/verify/codesign_darwin.go):
      # the signature chains to Apple and its leaf carries the pinned team.
      # Without "anchor apple generic" a self-signed certificate with a forged
      # OU would pass. Then the TeamIdentifier core reads as defence in depth,
      # which an ad-hoc signature does not carry.
      - name: Verify the binaries as core does
        run: |
          set -euo pipefail
          req="anchor apple generic and certificate leaf[subject.OU] = \"${APPLE_TEAM}\""
          for f in "$RUNNER_TEMP/dist/${ID}"-darwin-*; do
            echo "== $(basename "$f")"
            /usr/bin/codesign --verify --strict=all -R="$req" "$f"
            info=$(/usr/bin/codesign -d -vv "$f" 2>&1)
            printf '%s\n' "$info"
            team=$(printf '%s\n' "$info" | sed -n 's/^TeamIdentifier=//p')
            [ "$team" = "$APPLE_TEAM" ] || { echo "::error::$(basename "$f") carries TeamIdentifier '$team', not $APPLE_TEAM"; exit 1; }
            printf '%s\n' "$info" | grep -q '^Timestamp=' || { echo "::error::$(basename "$f") has no secure timestamp"; exit 1; }
            printf '%s\n' "$info" | grep -q 'flags=0x10000(runtime)' || { echo "::error::$(basename "$f") lacks the hardened runtime"; exit 1; }
          done

      # The installer package, from the signed binary: what an operator
      # installs by hand, and what Gatekeeper assesses on a guest. A stapled
      # ticket lets it install offline.
      - name: Build, sign, notarise and staple the .pkg
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          GOWORK: 'off'
        run: |
          set -euo pipefail
          (cd packaging/modulepkg && go build -o "$RUNNER_TEMP/modulepkg" .)
          mkdir -p "$RUNNER_TEMP/pkg"
          for f in "$RUNNER_TEMP/dist/${ID}"-darwin-*; do
            arch="${f##*-darwin-}"
            pkg=$(WEAVE_PKG_SIGN_IDENTITY="$INSTALLER_IDENTITY" "$RUNNER_TEMP/modulepkg" \
              -binary "$f" -manifest "$DIR/module.manifest.json" -arch "$arch" -out "$RUNNER_TEMP/pkg")
            echo "== $(basename "$pkg")"
            pkgutil --check-signature "$pkg"
            .github/scripts/notarize.sh "$pkg"
            .github/scripts/staple.sh "$pkg"
            spctl --assess -vv --type install "$pkg"
          done

      - name: Upload the signed binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-signed
          path: ${{ runner.temp }}/dist/${{ needs.module.outputs.id }}-darwin-*
          if-no-files-found: error
          retention-days: 7

      - name: Upload the .pkg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-pkg
          path: ${{ runner.temp }}/pkg/*.pkg
          if-no-files-found: error
          retention-days: 7

      - name: Remove the keychain and the notary key
        if: always()
        # The paths are fixed here rather than read from the environment: a
        # step that failed before setting them must not turn this into
        # removing ".".
        run: |
          security delete-keychain "$RUNNER_TEMP/weave-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP/certs" "$RUNNER_TEMP/zip"

  sign-windows:
    name: 'Sign ${{ needs.module.outputs.id }} for Windows'
    needs: [module, build]
    if: needs.module.outputs.windows == 'true'
    # signtool, not osslsigncode on Linux: the job has to run WinVerifyTrust
    # over the result anyway (the check core makes on a guest), which exists
    # only on Windows, and signtool is Microsoft's own signer, preinstalled
    # here, and signs the PowerShell scripts through the same call.
    runs-on: windows-latest
    # Read-only: this job holds the code-signing key, so it writes nothing but
    # its own workflow artifacts.
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      ID: ${{ needs.module.outputs.id }}
      DIR: ${{ needs.module.outputs.dir }}
      # The pinned leaf certificate and its public half, as organisation
      # variables: both are public, and the second is what core's installer
      # trusts on a guest.
      THUMBPRINT: ${{ vars.WINDOWS_CODESIGN_THUMBPRINT }}
      CODESIGN_CERT: ${{ vars.WINDOWS_CODESIGN_CERT }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.module.outputs.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packaging/modulezip/go.mod
          cache: false

      - name: Download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: ${{ runner.temp }}/dist

      # The PFX lives under the runner's temp directory, which a job-level env
      # cannot name; signtool is in the newest Windows SDK installed.
      - name: Signing paths
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Where-Object { $_.Directory.Parent.Name -match '^\d+(\.\d+){3}$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $sdk) { Write-Output '::error::no signtool.exe in any Windows SDK'; exit 1 }
          Write-Output "signtool: $($sdk.FullName)"
          "SIGNTOOL=$($sdk.FullName)" >> $env:GITHUB_ENV
          "CODESIGN_PFX=$env:RUNNER_TEMP\codesign\codesign.pfx" >> $env:GITHUB_ENV
          "CODESIGN_CER=$env:RUNNER_TEMP\codesign-public.cer" >> $env:GITHUB_ENV

      # Core refuses a Windows module whose leaf certificate's thumbprint is
      # not the one its manifest pins. Signing with a certificate the manifest
      # does not name would publish a module no device runs, so the manifest,
      # the THUMBPRINT variable and the public certificate must all agree.
      - name: The manifest pins the signing certificate
        run: |
          if (-not $env:THUMBPRINT) { Write-Output '::error::the WINDOWS_CODESIGN_THUMBPRINT variable is not set'; exit 1 }
          if (-not $env:CODESIGN_CERT) { Write-Output '::error::the WINDOWS_CODESIGN_CERT variable is not set'; exit 1 }
          $want = $env:THUMBPRINT.ToUpperInvariant()
          $signing = (Get-Content -LiteralPath "$env:DIR/module.manifest.json" -Raw | ConvertFrom-Json).signing
          $pinned = if ($signing) { "$($signing.authenticode_thumbprint)".ToUpperInvariant() } else { '' }
          if ($pinned -ne $want) {
            Write-Output "::error::$env:DIR/module.manifest.json pins authenticode_thumbprint '$pinned', signing is with $want"
            exit 1
          }
          # The variable holds the PEM, or the PEM base64-encoded once more.
          $text = $env:CODESIGN_CERT.Trim()
          if ($text -notmatch '-----BEGIN') { $text = [Text.Encoding]::ASCII.GetString([Convert]::FromBase64String($text)) }
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::CreateFromPem($text)
          if ($cert.Thumbprint -ne $want) {
            Write-Output "::error::WINDOWS_CODESIGN_CERT is $($cert.Thumbprint) ($($cert.Subject)), not the pinned $want"
            exit 1
          }
          [IO.File]::WriteAllBytes($env:CODESIGN_CER, $cert.RawData)
          Write-Output "signing as $($cert.Subject), thumbprint $want, valid until $($cert.NotAfter.ToString('u'))"

      # A real release has nothing to publish without these: core refuses an
      # unsigned Windows module, so the job fails here rather than let publish
      # ship binaries no device runs. The PFX is written to a directory the
      # cleanup step removes whatever happens; its password stays in the
      # environment of the steps that need it.
      - name: Import the signing certificate
        env:
          PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          foreach ($v in 'PFX', 'PFX_PASSWORD') {
            if (-not (Get-Item "env:$v" -ErrorAction SilentlyContinue).Value) {
              Write-Output "::error::the secret behind $v (WINDOWS_CODESIGN_$v) is not available to this workflow; Windows modules cannot be signed"
              exit 1
            }
          }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $env:CODESIGN_PFX) | Out-Null
          [IO.File]::WriteAllBytes($env:CODESIGN_PFX, [Convert]::FromBase64String($env:PFX))
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($env:CODESIGN_PFX, $env:PFX_PASSWORD, $flags)
          if (-not $cert.HasPrivateKey) { Write-Output '::error::WINDOWS_CODESIGN_PFX holds no private key'; exit 1 }
          if ($cert.Thumbprint -ne $env:THUMBPRINT.ToUpperInvariant()) {
            Write-Output "::error::WINDOWS_CODESIGN_PFX holds $($cert.Thumbprint) ($($cert.Subject)), not the pinned $env:THUMBPRINT"
            exit 1
          }
          $cert.Dispose()

      - name: Sign the windows binaries
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          . .github/scripts/authenticode.ps1
          $bins = @(Get-ChildItem "$env:RUNNER_TEMP\dist\$env:ID-windows-*.exe")
          if ($bins.Count -eq 0) { Write-Output '::error::the build produced no windows binary'; exit 1 }
          Invoke-AuthenticodeSigning -Path $bins.FullName
          foreach ($f in $bins) { Assert-Authenticode -Path $f.FullName }

      # The guest's view: core's installer adds the public certificate to the
      # machine's Root and TrustedPublisher stores, and core runs a module
      # only if WinVerifyTrust then accepts it and its leaf is the pinned one.
      # The machine stores, not the user's: the service runs as SYSTEM, and
      # adding to CurrentUser\Root raises a confirmation dialog that would hang
      # a headless runner.
      - name: Trust the certificate as a guest does
        run: |
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($env:CODESIGN_CER)
          foreach ($name in 'Root', 'TrustedPublisher') {
            $store = [Security.Cryptography.X509Certificates.X509Store]::new($name, 'LocalMachine')
            $store.Open('ReadWrite')
            $store.Add($cert)
            $store.Close()
          }

      - name: Verify the binaries as core does
        run: |
          . .github/scripts/authenticode.ps1
          foreach ($f in Get-ChildItem "$env:RUNNER_TEMP\dist\$env:ID-windows-*.exe") {
            Assert-Authenticode -Path $f.FullName -Trusted
          }

      # The package an operator or guestweave installs: the signed binary and
      # Authenticode-signed scripts, so they run under the AllSigned policy
      # once the certificate is trusted. Each zip is then installed and
      # removed again, under AllSigned, into a scratch directory.
      - name: Build, sign and check the .zip packages
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          GOWORK: 'off'
        run: |
          . .github/scripts/authenticode.ps1
          Push-Location packaging/modulezip
          go build -o "$env:RUNNER_TEMP\modulezip.exe" .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
          $scripts = "$env:RUNNER_TEMP\scripts"
          New-Item -ItemType Directory -Force -Path $scripts | Out-Null
          Copy-Item packaging/modulezip/scripts/*.ps1 $scripts
          $ps1 = @(Get-ChildItem "$scripts\*.ps1")
          Invoke-AuthenticodeSigning -Path $ps1.FullName
          foreach ($f in $ps1) { Assert-Authenticode -Path $f.FullName -Trusted }

          $zips = "$env:RUNNER_TEMP\zip"
          foreach ($f in Get-ChildItem "$env:RUNNER_TEMP\dist\$env:ID-windows-*.exe") {
            $arch = $f.BaseName -replace "^$([regex]::Escape($env:ID))-windows-", ''
            $zip = & "$env:RUNNER_TEMP\modulezip.exe" -binary $f.FullName -manifest "$env:DIR/module.manifest.json" `
              -arch $arch -out $zips -scripts $scripts
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Write-Output "== $(Split-Path -Leaf $zip)"

            $try = Join-Path $env:RUNNER_TEMP "try-$arch"
            Expand-Archive -LiteralPath $zip -DestinationPath "$try\pkg" -Force
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy AllSigned -File "$try\pkg\install.ps1" `
              -InstallDir "$try\Weave" -NoReload
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::install.ps1 from $(Split-Path -Leaf $zip) failed"; exit 1 }
            $installed = "$try\Weave\modules\$env:ID\$env:ID.exe"
            if ((Get-FileHash $installed).Hash -ne (Get-FileHash $f.FullName).Hash) {
              Write-Output "::error::install.ps1 did not install the signed binary"; exit 1
            }
            Assert-Authenticode -Path $installed -Trusted
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy AllSigned -File "$try\Weave\uninstall.d\$env:ID.ps1" -NoReload
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::the installed uninstaller failed"; exit 1 }
            if (Test-Path "$try\Weave\modules\$env:ID") { Write-Output '::error::the uninstaller left the module behind'; exit 1 }
          }

      - name: Upload the signed binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-signed
          path: ${{ runner.temp }}/dist/${{ needs.module.outputs.id }}-windows-*
          if-no-files-found: error
          retention-days: 7

      - name: Upload the .zip packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-zip
          path: ${{ runner.temp }}/zip/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Remove the PFX and the trusted certificate
        if: always()
        # The paths are fixed here rather than read from the environment: a
        # step that failed before setting them must not turn this into
        # removing something else.
        env:
          PIN: ${{ vars.WINDOWS_CODESIGN_THUMBPRINT }}
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP\codesign" -Recurse -Force -ErrorAction SilentlyContinue
          if ($env:PIN) {
            foreach ($name in 'Root', 'TrustedPublisher') {
              Remove-Item -LiteralPath "Cert:\LocalMachine\$name\$($env:PIN.ToUpperInvariant())" -ErrorAction SilentlyContinue
            }
          }

  publish:
    name: 'Publish ${{ needs.module.outputs.id }} ${{ needs.module.outputs.version }}'
    needs: [module, build, sign-darwin, sign-windows]
    # A signing job is skipped for a module with no platform of its OS, and a
    # skipped need would skip this job too without always().
    if: >-
      always() && needs.module.outputs.publish == 'true' && needs.build.result == 'success'
      && (needs.sign-darwin.result == 'success'
          || (needs.sign-darwin.result == 'skipped' && needs.module.outputs.darwin != 'true'))
      && (needs.sign-windows.result == 'success'
          || (needs.sign-windows.result == 'skipped' && needs.module.outputs.windows != 'true'))
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      DIR: ${{ needs.module.outputs.dir }}
      ID: ${{ needs.module.outputs.id }}
      VERSION: ${{ needs.module.outputs.version }}
      TAG: ${{ needs.module.outputs.tag }}
      CHANNELS_REPO: weaveplatform-release-channels
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.module.outputs.ref }}
          persist-credentials: false

      - name: Download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: ${{ runner.temp }}/dist

      - name: Download the signed darwin binaries
        if: needs.module.outputs.darwin == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-signed
          path: ${{ runner.temp }}/signed

      - name: Download the .pkg
        if: needs.module.outputs.darwin == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-pkg
          path: ${{ runner.temp }}/pkg

      - name: Download the signed windows binaries
        if: needs.module.outputs.windows == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-signed
          path: ${{ runner.temp }}/signed

      - name: Download the .zip packages
        if: needs.module.outputs.windows == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-zip
          path: ${{ runner.temp }}/pkg

      # Every darwin and windows binary is replaced by its signed counterpart
      # before anything is stamped, so the digest the channel pins is the
      # signed binary's: core checks that digest, then the signature, before
      # exec. A binary with no signed copy fails the release rather than ship
      # unsigned, which core would refuse on every device.
      - name: Put the signed binaries in place
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in "$RUNNER_TEMP/dist/${ID}"-darwin-* "$RUNNER_TEMP/dist/${ID}"-windows-*; do
            signed="$RUNNER_TEMP/signed/$(basename "$f")"
            [ -f "$signed" ] || { echo "::error::no signed $(basename "$f")"; exit 1; }
            cmp -s "$f" "$signed" && { echo "::error::$(basename "$f") is unchanged by signing"; exit 1; }
            mv "$signed" "$f"
          done

      - name: Stamp the sidecar manifest
        working-directory: ${{ needs.module.outputs.dir }}
        run: |
          set -euo pipefail
          arts="[]"
          for f in "$RUNNER_TEMP"/dist/*; do
            base=$(basename "$f")
            os=$(echo "$base" | sed -E "s/^${ID}-([a-z]+)-.*/\1/")
            arch=$(echo "$base" | sed -E "s/^${ID}-[a-z]+-([a-z0-9]+)(\.exe)?$/\1/")
            digest="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
            size=$(stat -c%s "$f")
            arts=$(echo "$arts" | jq --arg os "$os" --arg arch "$arch" --arg d "$digest" --argjson s "$size" \
              '. + [{os: $os, arch: $arch, digest: $d, size: $s}]')
          done
          jq --arg v "$VERSION" --argjson arts "$arts" '.version = $v | .artifacts = $arts' \
            module.manifest.json > "$RUNNER_TEMP/dist/module.manifest.json"
          cat "$RUNNER_TEMP/dist/module.manifest.json"

      - name: Set up Go for Linux packages
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packaging/moduledeb/go.mod
          cache: false

      # Use the stamped manifest, so the package carries the same version
      # and binary digests as the release and channel artifacts.
      - name: Build Linux Debian packages
        env:
          GOWORK: 'off'
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=("$RUNNER_TEMP/dist/${ID}"-linux-*)
          mkdir -p "$RUNNER_TEMP/pkg"
          if [ "${#bins[@]}" -gt 0 ]; then
            (cd packaging/moduledeb && go build -o "$RUNNER_TEMP/moduledeb" .)
            for f in "${bins[@]}"; do
              arch="${f##*-linux-}"
              pkg=$("$RUNNER_TEMP/moduledeb" -binary "$f" \
                -manifest "$RUNNER_TEMP/dist/module.manifest.json" -arch "$arch" -out "$RUNNER_TEMP/pkg")
              [ "$(dpkg-deb -f "$pkg" Package)" = "$ID" ]
              [ "$(dpkg-deb -f "$pkg" Version)" = "$VERSION" ]
              [ "$(dpkg-deb -f "$pkg" Architecture)" = "$arch" ]
              dpkg-deb --contents "$pkg"
            done
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Installer hashes cover the final signed/notarised bytes. Keep the
      # checksums outside both input directories until hashing is complete.
      - name: Sign release checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          sums="$RUNNER_TEMP/module-checksums.txt"
          : > "$sums"
          for dir in dist pkg; do
            for f in "$RUNNER_TEMP/$dir/"*; do
              printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")" >> "$sums"
            done
          done
          sort -k2 "$sums" > "$RUNNER_TEMP/pkg/checksums.txt"
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/pkg/checksums.txt.sigstore.json" \
            "$RUNNER_TEMP/pkg/checksums.txt"

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      # GHCR ties a package to the repository that first pushed it, and
      # GITHUB_TOKEN from any other repository gets 403 on the blob push until
      # the package grants this repository Write (Package settings → Manage
      # Actions access). A PAT with write:packages is org-scoped and is
      # preferred when one is set.
      - name: Refuse replacing released artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/existing-assets.json"; then
            test "$(jq '.assets | length' "$RUNNER_TEMP/existing-assets.json")" -eq 0 || {
              echo '::error::This version already has assets; publish a new module version.'
              exit 1
            }
          fi

      - name: Publish to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if oras resolve "ghcr.io/${GITHUB_REPOSITORY_OWNER}/weaveplatform-modules/${ID}:${VERSION}" >/dev/null 2>&1; then
            echo '::error::This module tag is already published; publish a new version.'
            exit 1
          fi
          cd "$RUNNER_TEMP/dist"
          oras push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/weaveplatform-modules/${ID}:${VERSION}" \
            --artifact-type application/vnd.weave.module \
            ./*

      # release-please creates the release when its PR merges, and this adds
      # the artifacts to it. A hand-cut tag has no release, so one is created
      # rather than the artifacts lost.
      - name: Attach the artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::no release for $TAG; creating one for the artifacts"
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$RUNNER_TEMP"/dist/* "$RUNNER_TEMP"/pkg/*

      # The dispatch needs write access to the channels repository, which this
      # repository's GITHUB_TOKEN never has. The org release-please App mints a
      # token scoped to that one repository; RELEASE_PLEASE_PAT is the
      # fallback where the App is unavailable.
      - name: Mint a channels token
        id: channels-token
        if: ${{ vars.RP_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RP_APP_ID }}
          private-key: ${{ secrets.RP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.CHANNELS_REPO }}

      # A module published but never offered for promotion is invisible to
      # every device, so a failed dispatch fails the job. Re-run it with
      # workflow_dispatch once the credential is fixed: the push is idempotent.
      - name: Request channel promotion
        env:
          GH_TOKEN: ${{ steps.channels-token.outputs.token || secrets.RELEASE_PLEASE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::no channels credential: the App token could not be minted and RELEASE_PLEASE_PAT is unset"
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY_OWNER}/${CHANNELS_REPO}/dispatches" \
            -f event_type=module-published \
            -f "client_payload[module]=${ID}" \
            -f "client_payload[version]=${VERSION}"; then
            echo "::error::module-published dispatch to ${CHANNELS_REPO} failed for ${ID} ${VERSION}"
            exit 1
          fi
          echo "requested promotion of ${ID} ${VERSION}"
