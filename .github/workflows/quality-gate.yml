name: go | Quality gate

# Every Go module in the workspace (go.work) passes, on each OS it targets:
# vet, blocking lint, tests with coverage in workspace mode, and a GOWORK=off
# build and test as a consumer of its released dependencies would see it. Then
# govulncheck, a cross-compile, a tidiness check, and the per-module coverage
# gate (each module's .testcoverage.yml over its merged per-OS profiles). The
# `gate` job is the single required status check.
#
# A module under modules/guestweave-<os>-<capability> runs on its own OS's
# runner only; every other module (pkg/) runs on all three.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    name: 'Discover modules'
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
      units: ${{ steps.discover.outputs.units }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.work'
          cache: false

      # go.work is the list of modules. A go.mod that never joined it would be
      # silently skipped here, so that is a failure rather than a gap.
      - name: Modules from go.work
        id: discover
        run: |
          set -euo pipefail
          mods=$(go work edit -json | jq -r '.Use[].DiskPath | ltrimstr("./")' | sort)
          found=$(find . -name go.mod -not -path './tools/*' -not -path './.git/*' -printf '%h\n' | sed 's#^\./##' | sort)
          missing=$(comm -13 <(printf '%s\n' "$mods") <(printf '%s\n' "$found"))
          if [ -n "$missing" ]; then
            echo "::error::modules missing from go.work: $missing"
            exit 1
          fi
          modules=$(printf '%s\n' "$mods" | jq -R . | jq -sc '{include: map({dir: ., slug: gsub("/"; "-")})}')
          units=$(printf '%s\n' "$mods" | jq -R . | jq -sc '{include: [.[] as $d
            | (($d | capture("^modules/guestweave-(?<os>linux|macos|windows)-")? | .os) // null) as $only
            | {linux: "ubuntu-latest", macos: "macos-latest", windows: "windows-latest"} | to_entries[]
            | select($only == null or .key == $only)
            | {dir: $d, slug: ($d | gsub("/"; "-")), os: .key, runner: .value}]}')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "units=$units" >> "$GITHUB_OUTPUT"
          echo "modules: $modules"
          echo "units: $units"

  unit:
    name: 'Test ${{ matrix.dir }} (${{ matrix.os }})'
    needs: [modules]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.units) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        # bash on every OS: PowerShell splits -coverprofile=cover.out at the dot.
        shell: bash
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '${{ matrix.dir }}/go.mod'
          cache-dependency-path: '${{ matrix.dir }}/go.sum'

      - name: Vet
        run: go vet ./...

      # Workspace mode, as a developer builds: sibling modules resolve to the
      # local tree. -coverpkg counts code a package's callers exercise.
      - name: Tests (race, shuffle, coverage)
        run: go test -race -shuffle=on -count=1 -coverpkg=./... -coverprofile=cover-${{ matrix.os }}.out ./...

      # The module alone, against the released versions its go.mod names: what
      # a consumer and the release build see. A workspace hides a requirement
      # missing from go.mod; this does not.
      - name: Standalone build and test (GOWORK=off)
        env:
          GOWORK: 'off'
        run: |
          go build ./...
          go test -count=1 ./...

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-${{ matrix.slug }}-${{ matrix.os }}
          path: ${{ matrix.dir }}/cover-${{ matrix.os }}.out
          if-no-files-found: error
          retention-days: 7

  lint:
    name: 'Lint ${{ matrix.dir }} (${{ matrix.os }})'
    needs: [modules]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.units) }}
    runs-on: ${{ matrix.runner }}
    env:
      GOWORK: 'off'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '${{ matrix.dir }}/go.mod'
          cache-dependency-path: '${{ matrix.dir }}/go.sum'

      # The linter version lives in a plain file so the deps refresh job can
      # move it without the workflows permission a workflow edit would need.
      - name: Linter version
        id: lintver
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/golangci-lint-version)" >> "$GITHUB_OUTPUT"

      # Per OS because build tags decide which files exist: the Windows
      # pseudo-console code is only ever linted on Windows.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lintver.outputs.version }}
          working-directory: ${{ matrix.dir }}
          args: --config=${{ github.workspace }}/.golangci.yml --new=false --fix=false

  vuln:
    name: 'govulncheck ${{ matrix.dir }}'
    needs: [modules]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.modules) }}
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '${{ matrix.dir }}/go.mod'
          cache-dependency-path: '${{ matrix.dir }}/go.sum'

      - name: govulncheck
        run: go tool -modfile="$GITHUB_WORKSPACE/tools/go.mod" govulncheck ./...

  build:
    name: 'Cross-compile ${{ matrix.dir }}'
    needs: [modules]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.modules) }}
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      CGO_ENABLED: '0'
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '${{ matrix.dir }}/go.mod'
          cache-dependency-path: '${{ matrix.dir }}/go.sum'

      - name: Build for every guest platform (CGO disabled)
        run: |
          set -euo pipefail
          for p in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64 windows/arm64; do
            echo "$p"
            GOOS=${p%/*} GOARCH=${p#*/} go build ./...
          done

  tidy:
    name: 'go.mod and go.work are tidy'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.work'
          cache: false

      - name: Tidy every module, sync the workspace, expect no change
        run: |
          set -euo pipefail
          for m in $(go work edit -json | jq -r '.Use[].DiskPath') ./tools; do
            echo "== $m"
            (cd "$m" && GOWORK=off go mod tidy)
          done
          go work sync
          git diff --exit-code

  coverage:
    name: 'Coverage gate ${{ matrix.dir }} (≥95% total, ≥90% per package)'
    needs: [modules, unit]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.modules) }}
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '${{ matrix.dir }}/go.mod'
          cache-dependency-path: '${{ matrix.dir }}/go.sum'

      - name: Download this module's per-OS profiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cover-${{ matrix.slug }}-*
          path: ${{ matrix.dir }}
          merge-multiple: true

      # The module's .testcoverage.yml names one profile per OS it runs on and
      # its exclusions relative to the module root; a profile that did not
      # arrive fails the gate rather than shrinking it.
      - name: Merge and enforce the gate
        run: |
          ls -l cover-*.out
          go tool -modfile="$GITHUB_WORKSPACE/tools/go.mod" go-test-coverage --config=.testcoverage.yml

  gate:
    name: 'Quality gate'
    if: always()
    needs: [modules, unit, lint, vuln, build, tidy, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a gate job did not succeed"; exit 1; }
          done
