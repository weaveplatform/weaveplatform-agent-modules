# Every dependency tracks its latest release. Updates arrive daily, grouped
# into one PR per ecosystem, majors included; auto-merge.yml merges each PR
# once the quality gate passes on it, so the gate is the only thing that can
# hold an update back.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      # "chore(deps): …": conventional, and not a releasable change
      prefix: "chore"
      include: "scope"

  # One entry per Go module. go.work is not a module; list each module that
  # joins it here as it lands (modules/*, cmd/*).
  - package-ecosystem: "gomod"
    directories:
      - "/pkg"
      - "/modules/weave-linux-presence"
      - "/modules/weave-macos-presence"
      - "/modules/weave-windows-presence"
      - "/modules/weave-linux-exec"
      - "/modules/weave-macos-exec"
      - "/modules/weave-windows-exec"
      - "/modules/weave-linux-power"
      - "/modules/weave-macos-power"
      - "/modules/weave-windows-power"
      - "/modules/weave-linux-time"
      - "/modules/weave-macos-time"
      - "/modules/weave-windows-time"
      - "/modules/weave-linux-metrics"
      - "/modules/weave-macos-metrics"
      - "/modules/weave-windows-metrics"
      - "/modules/weave-linux-clipboard"
      - "/modules/weave-macos-clipboard"
      - "/modules/weave-windows-clipboard"
      - "/modules/weave-linux-session"
      - "/modules/weave-macos-session"
      - "/modules/weave-windows-session"
      - "/modules/weave-linux-display"
      - "/modules/weave-macos-display"
      - "/modules/weave-windows-display"
      - "/tools"
    schedule:
      interval: "daily"
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
